name: CPU and source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-and-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: CPU invariants, lifecycle failures, evidence and source checks
        run: bash scripts/ci.sh
      - name: Recompute clean deployment release evidence
        if: ${{ hashFiles('results/release-v0.2.0-alpha.1/summary.json') != '' }}
        run: python3 results/release-v0.2.0-alpha.1/check.py
      - name: Verify source-alpha records and report hardware status
        if: ${{ hashFiles('results/release-v0.2.0-alpha.1/summary.json') == '' }}
        run: |
          python3 results/release-v0.2.0-alpha.1/check_alpha.py
